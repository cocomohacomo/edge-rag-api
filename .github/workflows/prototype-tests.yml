name: Offline RAG Prototype Tests

on:
  push:
    branches: [feature/standalone-windows-rag, feature/rag-quality-gates-v2]
  pull_request:
    branches: [main, feature/rwkv7-adaptive-generation-budget]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
