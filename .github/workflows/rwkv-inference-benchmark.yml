name: RWKV CPU Inference Benchmark

on:
  workflow_dispatch:
  push:
    branches: [feature/standalone-windows-rag]
    paths:
      - "benchmarks/rwkv_inference_benchmark.py"
      - ".github/workflows/rwkv-inference-benchmark.yml"

permissions:
  contents: read

jobs:
  rwkv-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libcurl4-openssl-dev
      - name: Build llama.cpp with CPU backend
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cmake -S llama.cpp -B llama.cpp/build -DGGML_NATIVE=OFF -DGGML_OPENMP=ON
          cmake --build llama.cpp/build --config Release -j 4 --target llama-cli
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download RWKV7 Q4_K_M from Hugging Face
        run: |
          python -m pip install --upgrade huggingface_hub
          hf download shoumenchougou/RWKV7-G1l-1.5B-GGUF rwkv7-g1l-1.5b-Q4_K_M.gguf --local-dir models
      - name: Run CPU inference benchmark
        env:
          MODEL_PATH: models/rwkv7-g1l-1.5b-Q4_K_M.gguf
          LLAMA_CLI: llama.cpp/build/bin/llama-cli
          RUNNER_NAME: ubuntu-latest
        run: python benchmarks/rwkv_inference_benchmark.py
      - name: Upload inference report
        uses: actions/upload-artifact@v4
        with:
          name: rwkv-inference-results
          path: rwkv-inference-results.json
          if-no-files-found: error
