name: End-to-End RAG Benchmark

on:
  push:
    branches: [feature/standalone-windows-rag]
    paths:
      - "benchmarks/rag_e2e_benchmark.py"
      - ".github/workflows/rag-e2e-benchmark.yml"
      - "rag/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rag-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libcurl4-openssl-dev
      - name: Build llama.cpp server with CPU backend
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cmake -S llama.cpp -B llama.cpp/build -DGGML_NATIVE=OFF -DGGML_OPENMP=ON
          cmake --build llama.cpp/build --config Release -j 4 --target llama-server
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download RWKV7 Q4_K_M model
        run: |
          python -m pip install --upgrade huggingface_hub
          hf download shoumenchougou/RWKV7-G1l-1.5B-GGUF rwkv7-g1l-1.5b-Q4_K_M.gguf --local-dir models
      - name: Run retrieval plus generation benchmark
        run: |
          python benchmarks/rag_e2e_benchmark.py \
            --model models/rwkv7-g1l-1.5b-Q4_K_M.gguf \
            --server llama.cpp/build/bin/llama-server \
            --threads 2 \
            --ctx 2048 \
            --max-tokens 48 \
            --output rag-e2e-results.json
      - name: Upload end-to-end report
        uses: actions/upload-artifact@v4
        with:
          name: rag-e2e-results
          path: rag-e2e-results.json
          if-no-files-found: error
